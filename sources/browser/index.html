<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>krank — browser demo</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0 auto; max-width: 60rem; padding: 2rem 1rem; font-family: system-ui, sans-serif; line-height: 1.4; }
        h1 { margin: 0 0 0.25rem; }
        p { margin: 0 0 1rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
        textarea, pre { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: 0.875rem; }
        textarea { height: 20rem; }
        pre { min-height: 6rem; padding: 1rem; border-radius: 0.25rem; overflow: auto; background: color-mix(in srgb, Canvas 92%, CanvasText 8%); }
        .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0; }
        button { font: inherit; padding: 0.4rem 1rem; }
        .note { opacity: 0.75; font-size: 0.875rem; }
    </style>
</head>
<body>
    <!-- HOMELAB-NAV -->
    <h1>krank</h1>
    <p>A minimal production-rules engine. This page loads <code>sources/krank.mjs</code> directly as a native ES module, with no build step, so it runs the same engine the package exports.</p>
    <label for="input">Rule set (JSON)</label>
    <textarea id="input" spellcheck="false"></textarea>
    <div class="row">
        <button id="run" type="button">Run</button>
        <button id="render" type="button">Render to prose</button>
        <button id="reset" type="button">Reset sample</button>
    </div>
    <pre id="output" aria-live="polite"></pre>
    <p class="note">Serve this directory over HTTP (for example <code>make demo</code>); ES modules do not load from <code>file://</code>.</p>
    <script type="module" src="./demo.mjs"></script>
</body>
</html>
