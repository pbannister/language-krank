<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>krank — file</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0 auto;
            max-width: 100rem;
            padding: 2rem 1rem;
            font-family: system-ui, sans-serif;
            line-height: 1.45;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 0 0 0.75rem;
            background: Canvas;
            border-bottom: 1px solid color-mix(in srgb, Canvas 78%, CanvasText 22%);
        }

        h1 {
            margin: 0.5rem 0 0.25rem;
            font-family: ui-monospace, monospace;
            font-size: 1.05rem;
        }

        a {
            color: inherit;
        }

        .note {
            margin: 0;
            opacity: 0.75;
            font-size: 0.875rem;
        }

        main {
            margin-top: 1rem;
        }

        .file-line {
            display: grid;
            grid-template-columns: 4rem minmax(0, 1fr);
            gap: 0.75rem;
            font-family: ui-monospace, monospace;
            font-size: 0.8125rem;
        }

        .file-line .number {
            text-align: right;
            opacity: 0.45;
            user-select: none;
        }

        .file-line .text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .file-line.highlight {
            background: color-mix(in srgb, Canvas 70%, #f9a825 30%);
        }
    </style>
</head>

<body>
    <header>
        <a href="./index.html">← Back to the studio</a>
        <h1 id="title">file</h1>
        <p class="note" id="note">Loading…</p>
    </header>
    <main id="lines"></main>

    <script type="module">
        import { render_file } from "./file-view.mjs";

        const params = new URLSearchParams(location.search);
        const path = params.get("path") ?? "";
        const note = document.querySelector("#note");
        document.querySelector("#title").textContent = path;

        render_file(document.querySelector("#lines"), {
            path,
            section: params.get("section") ?? "",
            term: params.get("term") ?? "",
        }, note).catch((error) => {
            note.textContent = error.message;
        });
    </script>
</body>

</html>
